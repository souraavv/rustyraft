name: Real Simulation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  real-simulation:
    name: Real Simulation (${{ matrix.nodes }} nodes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        nodes: [3, 5, 7, 15]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run real cluster simulation
        env:
          NODE_COUNT: ${{ matrix.nodes }}
        run: python3 tests/real-simulation/rustyraft.py --nodes "$NODE_COUNT"
