[package]
name = "rustyraft"
version = "0.1.0"
edition = "2024"

[dependencies]
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
bincode = { version = "2", features = ["serde"] }

tokio = {
    version = "1",
    features = [
        "net",
        "io-util",
        "sync",
        "rt",
        "rt-multi-thread",
        "macros",
        "time",
    ],
}